name: Supabase migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply pending migrations to production"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Validate and apply Supabase migrations
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Missing SUPABASE_PROJECT_REF"; exit 1; }

      - name: Verify migration directory
        shell: bash
        run: |
          set -euo pipefail
          test -d supabase/migrations || { echo "supabase/migrations directory not found"; exit 1; }
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Baseline existing production schema
        shell: bash
        run: |
          set -euo pipefail
          # The production tables already existed before migrations were introduced.
          # Mark only the initial schema migration as applied so it is not executed again.
          if ! supabase migration list --linked | grep -E '^\s*0001\s+\|\s+0001\s+' >/dev/null 2>&1; then
            supabase migration repair 0001 --status applied --linked
          fi

      - name: Show migration status
        run: supabase migration list --linked

      - name: Dry-run database push
        run: supabase db push --linked --dry-run --include-all

      - name: Apply migrations
        if: ${{ github.event_name == 'push' || inputs.apply }}
        run: supabase db push --linked --include-all
