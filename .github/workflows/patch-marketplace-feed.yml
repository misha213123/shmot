name: Patch marketplace feed fallback

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-marketplace-feed.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch marketplace feed
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend/src/app/MarketplaceApp.tsx')
          text = path.read_text(encoding='utf-8')

          old_cache = """function readCachedFeed(userId: string): ApiProduct[] {
  try {
    const value = localStorage.getItem(feedCacheKey(userId));
    const parsed = value ? JSON.parse(value) : [];
    return Array.isArray(parsed) ? parsed.filter((item) => item?.seller_id !== userId) : [];
  } catch { return []; }
}
function cacheFeed(userId: string, items: ApiProduct[]) {
  try { localStorage.setItem(feedCacheKey(userId), JSON.stringify(items.filter((item) => item.seller_id !== userId))); } catch { /* ignore */ }
}
"""
          new_cache = """function readCachedFeed(userId: string): ApiProduct[] {
  try {
    const value = localStorage.getItem(feedCacheKey(userId));
    const parsed = value ? JSON.parse(value) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch { return []; }
}
function cacheFeed(userId: string, items: ApiProduct[]) {
  try { localStorage.setItem(feedCacheKey(userId), JSON.stringify(items)); } catch { /* ignore */ }
}
"""

          old_refresh = """      if (feedResult.status === 'fulfilled') {
        const items = feedResult.value.items.filter((item) => item.seller_id !== profile.id);
        setFeedProducts(items);
        cacheFeed(profile.id, items);
        setFeedIndex((current) => {
          if (currentProductId) {
            const preservedIndex = items.findIndex((item) => item.id === currentProductId);
            if (preservedIndex >= 0) return preservedIndex;
          }
          return Math.min(current, Math.max(items.length - 1, 0));
        });
        setHistory((ids) => ids.filter((id) => items.some((item) => item.id === id)));
      } else if (!feedProducts.length) setFeedError(true);
      if (mineResult.status === 'fulfilled') setMyProducts(mineResult.value.items);
"""
          new_refresh = """      const mine = mineResult.status === 'fulfilled' ? mineResult.value.items : [];
      if (mineResult.status === 'fulfilled') setMyProducts(mine);
      if (feedResult.status === 'fulfilled') {
        const activeItems = feedResult.value.items;
        const otherSellerItems = activeItems.filter((item) => item.seller_id !== profile.id);
        const ownActiveItems = mine.filter((item) => item.status === 'active');
        const items = otherSellerItems.length > 0 ? otherSellerItems : ownActiveItems;
        setFeedProducts(items);
        cacheFeed(profile.id, items);
        setFeedIndex((current) => {
          if (currentProductId) {
            const preservedIndex = items.findIndex((item) => item.id === currentProductId);
            if (preservedIndex >= 0) return preservedIndex;
          }
          return Math.min(current, Math.max(items.length - 1, 0));
        });
        setHistory((ids) => ids.filter((id) => items.some((item) => item.id === id)));
      } else if (!feedProducts.length) setFeedError(true);
"""

          old_empty = """    if (!product) return <>{header()}<div className=\"empty-state motion-pop\"><b>{feedError ? 'Не удалось загрузить ленту' : 'В ленте пока нет товаров других продавцов'}</b><p>{feedError ? 'Проверь соединение или повтори загрузку.' : 'Твои объявления видны другим пользователям, а здесь появятся их товары.'}</p><button className=\"primary-button\" onClick={() => feedError ? void refreshMarketplace() : navigate('create')}>{feedError ? 'Повторить' : 'Добавить товар'}</button></div></>;
"""
          new_empty = """    if (!product) return <>{header()}<div className=\"empty-state motion-pop\"><b>{feedError ? 'Не удалось загрузить ленту' : 'В ленте пока нет товаров'}</b><p>{feedError ? 'Проверь соединение или повтори загрузку.' : 'Добавь первое объявление — оно появится в профиле и временно в ленте, пока не появятся другие продавцы.'}</p><button className=\"primary-button\" onClick={() => feedError ? void refreshMarketplace() : navigate('create')}>{feedError ? 'Повторить' : 'Добавить товар'}</button></div></>;
"""

          replacements = [
              (old_cache, new_cache, 'cache functions'),
              (old_refresh, new_refresh, 'feed refresh'),
              (old_empty, new_empty, 'empty feed copy'),
          ]
          for old, new, label in replacements:
              if old not in text:
                  raise SystemExit(f'Expected block not found: {label}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/MarketplaceApp.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(feed): fall back to own active listings"
          git push
