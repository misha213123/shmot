name: Fix notifications empty feed and speed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-notifications-empty-feed-performance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch frontend
        shell: python
        run: |
          from pathlib import Path

          # 1. Notifications must always be fresh. The previous cachedRequest returned
          # stale notifications on every poll and refreshed only silently in background.
          api_path = Path('frontend/src/lib/api.ts')
          api = api_path.read_text(encoding='utf-8')
          api = api.replace(
              "notifications: () => cachedRequest('me:notifications', () => request<NotificationListResponse>('/api/v1/me/notifications', undefined, true)),\n  readAllNotifications: () => request<void>('/api/v1/me/notifications/read-all', { method: 'POST', body: JSON.stringify({}) }, true),",
              "notifications: () => request<NotificationListResponse>('/api/v1/me/notifications', { cache: 'no-store' }, true),\n  readAllNotifications: async () => {\n    await request<void>('/api/v1/me/notifications/read-all', { method: 'POST', body: JSON.stringify({}) }, true);\n    clearCache('me:notifications');\n  },"
          )
          api_path.write_text(api, encoding='utf-8')

          # 2. Empty feed must keep its header and notification bell visible.
          empty_path = Path('frontend/src/lib/emptyFeedRuntime.ts')
          empty_text = empty_path.read_text(encoding='utf-8')
          empty_text = empty_text.replace(
              "  state.dataset.emptyFeedUpgraded = '1';\n  state.classList.add('empty-feed-premium');",
              "  state.dataset.emptyFeedUpgraded = '1';\n  shell.classList.add('empty-feed-mode');\n  state.classList.add('empty-feed-premium');"
          )
          empty_path.write_text(empty_text, encoding='utf-8')

          css_path = Path('frontend/src/styles/empty-feed.css')
          css = css_path.read_text(encoding='utf-8')
          header_css = """
.app-shell.feed-screen.empty-feed-mode .topbar {
  display: grid !important;
  grid-template-columns: 52px minmax(0, 1fr) 52px;
  align-items: center;
  position: relative;
  z-index: 30;
  min-height: 82px;
  padding: max(12px, env(safe-area-inset-top)) 18px 12px;
  background: #000;
  color: #fff;
}
.app-shell.feed-screen.empty-feed-mode .topbar .icon-button {
  display: grid !important;
  visibility: visible !important;
  opacity: 1 !important;
  color: #fff !important;
  pointer-events: auto !important;
}
.app-shell.feed-screen.empty-feed-mode .topbar .brand {
  position: static !important;
  transform: none !important;
  text-align: center;
  color: #fff;
}
.app-shell.feed-screen.empty-feed-mode .empty-feed-premium {
  margin-top: 16px;
}
"""
          if 'empty-feed-mode .topbar' not in css:
              css = header_css + '\n' + css
          css_path.write_text(css, encoding='utf-8')

          # 3. React header should open the notification center runtime, not a placeholder toast.
          market_path = Path('frontend/src/app/MarketplaceApp.tsx')
          market = market_path.read_text(encoding='utf-8')
          market = market.replace(
              "onNotifications={() => showNotice('Уведомлений пока нет')}",
              "onNotifications={() => window.dispatchEvent(new CustomEvent('driply:open-notifications'))}"
          )
          market_path.write_text(market, encoding='utf-8')

          # 4. Chat polling should tell the notification center to refresh immediately
          # after sending a message, rather than waiting for the next interval.
          chat_path = Path('frontend/src/lib/chatRuntime.ts')
          chat = chat_path.read_text(encoding='utf-8')
          chat = chat.replace(
              "      await load(true);",
              "      await load(true);\n      window.dispatchEvent(new CustomEvent('driply:notifications-refresh'));",
              1
          )
          chat_path.write_text(chat, encoding='utf-8')

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/api.ts frontend/src/lib/emptyFeedRuntime.ts frontend/src/styles/empty-feed.css frontend/src/app/MarketplaceApp.tsx frontend/src/lib/chatRuntime.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(app): fresh notifications visible empty header and faster updates"
          git push
